services:
  - type: web
    name: verified-execution-agent
    runtime: python
    buildCommand: pip install ".[postgres,gemini,anthropic]"
    startCommand: uvicorn verified_agent.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /settings
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_PROVIDER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: LLM_TIMEOUT_SECONDS
        value: "60"
