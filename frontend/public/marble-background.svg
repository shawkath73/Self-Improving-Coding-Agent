<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="marble" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency=".006 .035" numOctaves="5" seed="19" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="145" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f1f1f1"/>
      <stop offset=".45" stop-color="#bdbdbd"/>
      <stop offset="1" stop-color="#eeeeee"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#777" stop-opacity=".72"/>
      <stop offset=".5" stop-color="#fafafa" stop-opacity=".9"/>
      <stop offset="1" stop-color="#4e4e4e" stop-opacity=".72"/>
    </linearGradient>
    <pattern id="grain" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="2" r=".45" fill="#fff" opacity=".2"/>
      <circle cx="5" cy="6" r=".4" fill="#222" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#paper)"/>
  <g filter="url(#marble)" opacity=".95">
    <path d="M-180 150C120-80 230 360 490 80s360-50 560 80 270-170 710-20v210c-330-150-470 80-730-40S700 150 520 360 160 390-180 560z" fill="url(#ink)"/>
    <path d="M-160 610c310-300 410 170 710-80s400-180 650 30 310-70 560-120v250c-250 20-400 260-700 30s-390-30-610 150-390-50-610-10z" fill="url(#ink)"/>
    <path d="M-120 940c280-190 390-20 620-190s420-100 640 20 370 40 580-80v310H-120z" fill="#888" opacity=".48"/>
    <path d="M100-120c90 250 260 220 420 20s280-220 420-80 210 350 450 270 260-90 330-20" fill="none" stroke="#fff" stroke-width="24" opacity=".45"/>
    <path d="M-40 270c190-110 300 210 500 40s290-160 470-30 280 50 530-80" fill="none" stroke="#3f3f3f" stroke-width="10" opacity=".35"/>
  </g>
  <rect width="1600" height="1000" fill="url(#grain)" opacity=".38"/>
